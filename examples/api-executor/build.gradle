plugins {
    id 'application'
    id 'com.diffplug.spotless' version '8.0.0'
}

application {
    mainClass = 'dev.openfga.sdk.example.ApiExecutorExample'
}

// Additional run task for the streaming variant
tasks.register('runStreaming', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.openfga.sdk.example.StreamingApiExecutorExample'
}

repositories {
    mavenCentral()
}

ext {
    jacksonVersion = "3.2.2"
}

dependencies {
    // Use local build of SDK
    implementation files('../../build/libs/openfga-sdk-0.10.0.jar') // x-release-please-version

    // OpenFGA Language SDK for DSL transformation
    implementation("dev.openfga:openfga-language:v0.2.0-beta.1")

    // Serialization
    implementation(platform("tools.jackson:jackson-bom:$jacksonVersion"))
    implementation("tools.jackson.core:jackson-databind")

    // openfga-language still requires Jackson 2.
    implementation(platform("com.fasterxml.jackson:jackson-bom:2.22.2"))

    // OpenTelemetry (required by SDK)
    implementation platform("io.opentelemetry:opentelemetry-bom:1.65.0")
    implementation "io.opentelemetry:opentelemetry-api"

    // JSR305 (required by SDK)
    implementation "com.google.code.findbugs:jsr305:3.0.2"
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    // comment out below to run spotless as part of the `check` task
    enforceCheck false
    format 'misc', {
        // define the files (e.g. '*.gradle', '*.md') to apply `misc` to
        target '.gitignore'
        // define the steps to apply to those files
        trimTrailingWhitespace()
        indentWithSpaces() // Takes an integer argument if you don't like 4
        endWithNewline()
    }
    java {
        palantirJavaFormat()
        removeUnusedImports()
        importOrder()
    }
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
tasks.register('fmt') {
    dependsOn 'spotlessApply'
}
