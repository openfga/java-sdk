plugins {
    id 'application'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

application {
    switch (language) {
        case 'kotlin':
            mainClass = 'dev.openfga.sdk.example.KotlinExample1'
            break
        default:
            mainClass = 'dev.openfga.sdk.example.Example1'
    }
}

repositories {
    mavenCentral()
}

ext {
    jacksonVersion = "3.2.3"
}

dependencies {
    implementation("dev.openfga:openfga-sdk:0.10.1") // x-release-please-version

    // Serialization
    implementation(platform("tools.jackson:jackson-bom:$jacksonVersion"))
    implementation("tools.jackson.core:jackson-databind")

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    // comment out below to run spotless as part of the `check` task
    enforceCheck false
    format 'misc', {
        // define the files (e.g. '*.gradle', '*.md') to apply `misc` to
        target '.gitignore'
        // define the steps to apply to those files
        trimTrailingWhitespace()
        indentWithSpaces() // Takes an integer argument if you don't like 4
        endWithNewline()
    }
    java {
        palantirJavaFormat()
        removeUnusedImports()
        importOrder()
    }
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
tasks.register('fmt') {
    dependsOn 'spotlessApply'
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
